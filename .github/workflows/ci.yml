name: build-and-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet build FocusDock.sln -c Release
      - run: dotnet run --project tests/FocusDock.Tests -c Release --no-build
