name: release-installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: PomoDock-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/PomoDock-Setup-${{ steps.version.outputs.value }}.exe
            artifacts/PomoDock-Setup-${{ steps.version.outputs.value }}.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "artifacts/PomoDock-Setup-${{ steps.version.outputs.value }}.exe",
            "artifacts/PomoDock-Setup-${{ steps.version.outputs.value }}.sha256"
          )
          if (gh release view "$env:GITHUB_REF_NAME" 2>$null) {
            gh release upload "$env:GITHUB_REF_NAME" @assets --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" @assets `
              --title "PomoDock ${{ steps.version.outputs.value }}" `
              --generate-notes
          }
