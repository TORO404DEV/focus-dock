<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PomoDock</title>
  <meta name="description" content="PomoDock — second-monitor focus workspace for Windows. English and Spanish.">
  <meta name="theme-color" content="#171916">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://pomodock.com/">
  <link rel="alternate" hreflang="en" href="https://pomodock.com/en/">
  <link rel="alternate" hreflang="es" href="https://pomodock.com/es/">
  <link rel="alternate" hreflang="x-default" href="https://pomodock.com/">
  <link rel="icon" href="assets/pomodock-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
    (() => {
      let saved = null;
      try { saved = localStorage.getItem('pomodock-language'); } catch (_) {}
      const browserLanguages = navigator.languages || [navigator.language || 'en'];
      const preferred = saved || (browserLanguages.some((language) => language.toLowerCase().startsWith('es')) ? 'es' : 'en');
      window.location.replace((preferred === 'es' ? 'es/' : 'en/') + window.location.hash);
    })();
  </script>
</head>
<body class="language-gateway">
  <main class="language-card">
    <img src="assets/pomodock-mark.svg" width="48" height="48" alt="">
    <p class="eyebrow">Windows · Open source</p>
    <h1>PomoDock</h1>
    <p>Your second monitor, as a focus workspace.</p>
    <nav aria-label="Choose language / Elige idioma">
      <a class="button button-primary" href="en/" lang="en" hreflang="en" data-language="en">English</a>
      <a class="button button-ghost" href="es/" lang="es" hreflang="es" data-language="es">Español</a>
    </nav>
  </main>
  <noscript><p class="gateway-noscript">Choose a language above / Elige un idioma arriba.</p></noscript>
</body>
</html>
